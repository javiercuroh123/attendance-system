services:
  postgres:
    image: postgres:17
    container_name: attendance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_api
      POSTGRES_PASSWORD: "anniongNano123$"
      POSTGRES_DB: attendance_db
    ports:
      - "5434:5432"
    volumes:
      - attendance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_api -d attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  attendance_pgdata:
