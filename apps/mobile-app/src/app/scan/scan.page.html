<ion-content [fullscreen]="true" [scrollY]="false" class="scan-content">
  <div class="scan-shell">
    <header class="scan-header">
      <div class="header-left">
        <button type="button" class="back-btn" routerLink="/home" aria-label="Volver">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </button>
        <h1>Escanear QR</h1>
      </div>
    </header>

    <main class="scan-body">
      <section class="qr-scanner-area">
        <div class="qr-viewfinder" aria-hidden="true">
          <video
            *ngIf="!usesNativeScanner"
            #previewVideo
            class="qr-preview-video"
            [class.active]="isScannerActive"
            autoplay
            playsinline
            muted
          ></video>
          <div class="qr-preview-placeholder" *ngIf="usesNativeScanner || !isScannerActive">
            <ion-icon name="scan-outline"></ion-icon>
          </div>
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <span class="qr-scan-line" *ngIf="isScannerActive"></span>
        </div>

        <div class="qr-instructions">
          <p>Coloca el codigo QR dentro del marco</p>
          <small>{{ scannerMessage }}</small>
        </div>

        <button
          type="button"
          class="camera-btn"
          [disabled]="isPreparingScanner || !isScannerSupported"
          (click)="toggleScanner()"
        >
          <ion-icon name="flash-outline"></ion-icon>
          <span>{{ isPreparingScanner ? 'Preparando...' : scannerActionLabel }}</span>
        </button>

        <label class="token-label" for="qrToken">Token QR</label>
        <input
          id="qrToken"
          class="token-input"
          type="text"
          [(ngModel)]="qrToken"
          placeholder="Pega aqui el qrToken o JSON"
          [disabled]="isSubmitting"
        />

        <p class="scan-error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button
          type="button"
          class="manual-btn"
          (click)="submitAttendanceCheck()"
          [disabled]="isSubmitting || isPreparingScanner"
        >
          <ion-icon name="flash-outline"></ion-icon>
          <span>{{ isSubmitting ? 'Enviando...' : 'Registrar Marcacion' }}</span>
        </button>
      </section>
    </main>

    <div class="qr-result-overlay" [class.show]="showResult" [attr.aria-hidden]="!showResult">
      <div class="qr-result-card">
        <div class="qr-result-icon">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
        </div>
        <h2>{{ resultTitle }}</h2>
        <p>{{ resultDescription }}</p>
      </div>
    </div>
  </div>
</ion-content>
