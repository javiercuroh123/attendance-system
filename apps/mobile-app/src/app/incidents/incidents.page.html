<ion-content [fullscreen]="true" [scrollY]="false" class="incidents-content">
  <div class="incidents-shell">
    <app-page-header>
      <h1 header-left class="page-title">Incidencias</h1>
    </app-page-header>

    <main class="incidents-body">
      <section class="incidents-tabs" aria-label="Navegacion interna de incidencias">
        <button
          type="button"
          class="incidents-tab"
          [class.active]="activeTab === 'list'"
          (click)="setTab('list')"
        >
          Mis Solicitudes
        </button>

        <button
          type="button"
          class="incidents-tab"
          [class.active]="activeTab === 'form'"
          (click)="setTab('form')"
        >
          Nueva Solicitud
        </button>
      </section>

      <section *ngIf="activeTab === 'list'" class="incident-list-view">
        <p class="feedback-error" *ngIf="errorMessage">{{ errorMessage }}</p>
        <div class="loading-state" *ngIf="isLoading">Cargando solicitudes...</div>

        <div class="incident-list" *ngIf="!isLoading && incidents.length > 0; else noIncidents">
          <article class="incident-item" *ngFor="let incident of incidents">
            <div class="incident-item-header">
              <span class="incident-type" [ngClass]="typeClass(incident.type)">
                {{ typeLabel(incident.type) }}
              </span>
              <span class="incident-status" [ngClass]="statusClass(incident.status)">
                {{ statusLabel(incident.status) }}
              </span>
            </div>
            <p class="incident-item-date">{{ incident.dateLabel }}</p>
            <p class="incident-item-desc">{{ incident.description }}</p>
          </article>
        </div>

        <ng-template #noIncidents>
          <div class="empty-state" *ngIf="!isLoading">
            <ion-icon name="file-tray-outline"></ion-icon>
            <h3>Sin solicitudes registradas</h3>
            <p>Cuando registres una incidencia, aparecera aqui.</p>
          </div>
        </ng-template>
      </section>

      <section *ngIf="activeTab === 'form'" class="incident-form-view">
        <p class="feedback-error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <form class="incident-form" (submit)="$event.preventDefault()" novalidate>
          <div class="form-group">
            <label for="incidentDate">Fecha de asistencia</label>
            <input
              id="incidentDate"
              type="date"
              class="form-input"
              name="incidentDate"
              [(ngModel)]="form.attendanceDate"
            />
          </div>

          <div class="form-group">
            <label for="incidentType">Tipo de solicitud</label>
            <select
              id="incidentType"
              class="form-select"
              name="incidentType"
              [(ngModel)]="form.requestType"
            >
              <option value="">Seleccionar tipo...</option>
              <option value="REGULARIZATION">Regularizacion</option>
              <option value="PERMISSION">Permiso</option>
              <option value="JUSTIFICATION">Justificacion</option>
            </select>
          </div>

          <div class="form-group">
            <label for="incidentDesc">Descripcion del motivo</label>
            <textarea
              id="incidentDesc"
              class="form-textarea"
              name="incidentDesc"
              [(ngModel)]="form.description"
              placeholder="Describa el motivo de su solicitud..."
            ></textarea>
          </div>

          <button type="button" class="submit-btn" (click)="submitIncident()" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Enviando...' : 'Enviar Solicitud' }}
          </button>
        </form>
      </section>
    </main>
  </div>
</ion-content>
